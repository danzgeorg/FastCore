# Install with: pip install --group dev
# The ruff pin must match the version used in .github/workflows/lint.yml.
[dependency-groups]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "email-validator",
]

[tool.mypy]
python_version = "3.14"
strict = true
# Strictness beyond --strict: forbid Any in any form and flag dead code.
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "redundant-self",
    "mutable-override",
    "unused-awaitable",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter-incompatible rules, per the official Ruff recommendation.
    "COM812",
    "ISC001",
    # The repository has no copyright header policy.
    "CPY001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Warmup exercises are standalone teaching scripts, not library code:
# printing results, module-level execution and demonstrating globals are
# the point of the exercises.
"warmup/**" = [
    "T201",    # print
    "INP001",  # implicit namespace package
    "PLW0603", # global statement
]
